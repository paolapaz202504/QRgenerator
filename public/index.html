<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Studio Pro — Generador de Códigos QR Avanzado</title>
  <!-- Tailwind CSS CDN + Production Console Warning Suppressor -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (typeof console !== 'undefined' && console.warn) {
      const _origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
        _origWarn.apply(console, args);
      };
    }
  </script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 25 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Bebas+Neue&family=Caveat:wght@600;700&family=Cinzel:wght@600;700&family=Comfortaa:wght@600;700&family=Dancing+Script:wght@700&family=Fira+Code:wght@600;700&family=Great+Vibes&family=Lobster&family=Lora:ital,wght@0,600;1,600&family=Monoton&family=Montserrat:wght@600;700;800&family=Oswald:wght@500;700&family=Outfit:wght@500;600;700;800&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&family=Press+Start+2P&family=Righteous&family=Roboto:wght@500;700&family=Satisfy&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Client-side QRCode lib -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- Official Google Identity Services OAuth 2.0 SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full flex flex-col font-['Plus_Jakarta_Sans'] bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none"></div>

  <!-- Header Navbar Component Container -->
  <div id="header-container"></div>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Left Column: Controls & Form (7 cols) -->
      <div class="lg:col-span-7 space-y-6">
        <div id="step1-container"></div>
        <div id="step2-container"></div>
        <div id="step3-container"></div>
        <div id="color-customizer-container"></div>
        <div id="action-buttons-container"></div>
      </div>

      <!-- Right Column: Live Interactive Preview & Download (5 cols) -->
      <div class="lg:col-span-5 space-y-6 lg:sticky lg:top-24">
        <div id="preview-download-container"></div>
      </div>

    </div>

    <!-- Sección Incorporada: Historial y Tabla de Códigos QR Generados -->
    <div id="history-container"></div>
  </main>

  <!-- Modals Container (Preview Modal & OAuth Modal) -->
  <div id="modals-container"></div>

  <!-- Footer Component Container -->
  <div id="footer-container"></div>

  <!-- Main JS Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
