<!-- Section 1: 20 Categories & 600 Styled Designs (Light SaaS Theme - Multi-Device Responsive) -->
<div class="bg-white border border-slate-200/90 rounded-xl sm:rounded-2xl p-4 sm:p-6 shadow-xs space-y-3.5 sm:space-y-4 hover:shadow-sm transition">
  <button id="toggle-step3" type="button" class="w-full flex items-center justify-between text-left focus:outline-none gap-2">
    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
      <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg bg-purple-50 border border-purple-200 text-purple-700 font-bold text-xs sm:text-sm flex items-center justify-center shrink-0">1</span>
      <div class="min-w-0">
        <h2 class="text-sm sm:text-base font-semibold text-slate-900 flex items-center gap-1.5 truncate">
          <i class="fa-solid fa-palette text-purple-600 text-xs sm:text-sm"></i>
          <span class="truncate">Selecciona el Diseño por Categoría</span>
        </h2>
        <p class="text-[11px] sm:text-xs text-slate-500 truncate">20 Categorías temáticas y 600 plantillas profesionales</p>
      </div>
    </div>
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <span id="design-count-badge" class="text-[10px] sm:text-xs font-semibold px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-full bg-purple-50 text-purple-700 border border-purple-200 font-mono">
        600 Diseños
      </span>
      <i id="icon-toggle-step3" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200 rotate-180"></i>
    </div>
  </button>

  <div id="panel-step3" class="space-y-3 sm:space-y-4 pt-3 border-t border-slate-100">
    <!-- Category Filter Tabs forming multiline wrapped rows -->
    <div class="flex flex-wrap gap-1.5 sm:gap-2 items-center pt-0.5 sm:pt-1" id="category-tabs">
      <!-- Dynamically populated into wrapped multiline rows -->
    </div>

    <!-- Design Grid (2 columnas en móviles, 3 en tablets, 4 en desktop) -->
    <div id="design-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 sm:gap-3 max-h-[320px] sm:max-h-[400px] overflow-y-auto pr-1 custom-scrollbar">
      <!-- Dynamically populated -->
    </div>
  </div>
</div>
