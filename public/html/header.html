<!-- Header Navbar Component (Light SaaS Theme - Multi-Device Responsive) -->
<header class="border-b border-slate-200 bg-white/95 backdrop-blur-md sticky top-0 z-50 shadow-xs">
  <div class="max-w-7xl mx-auto px-2.5 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-1.5 sm:gap-4 flex-nowrap">
    <!-- Brand / Logo Area -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0 min-w-0">
      <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl overflow-hidden shadow-md shadow-indigo-500/20 shrink-0 border border-indigo-400/30 flex items-center justify-center bg-indigo-950 group">
        <img src="/favicon.svg" alt="QRbey Logo" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
      </div>
      <div class="min-w-0 flex items-center gap-1.5 sm:gap-2">
        <div>
          <div class="flex items-center gap-1.5 sm:gap-2">
            <h1 class="text-lg sm:text-xl font-bold font-['Outfit'] tracking-tight text-slate-900">
              QRbey
            </h1>
            <!-- Changelog Modal Trigger Badge (Estándar DevTeam) -->
            <button id="btn-open-changelog" type="button" title="Ver Historial de Cambios / Novedades"
              class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200/80 text-[10px] sm:text-[11px] font-mono font-bold px-1.5 sm:px-2 py-0.5 rounded-full flex items-center gap-1 transition active:scale-95 shadow-2xs">
              <i class="fa-solid fa-code-branch text-[8px] sm:text-[9px]"></i>
              <span>v1.8.5</span>
            </button>
          </div>
          <p class="text-xs text-slate-500 font-medium hidden xl:block truncate max-w-xs">Códigos QR dinámicos para negocios de barrio</p>
        </div>
      </div>
    </div>

    <!-- Navegación Directa por Verticales y Sobre Nosotros (SEO & Conversión) -->
    <nav class="hidden lg:flex items-center gap-1 xl:gap-2 text-xs font-semibold text-slate-600">
      <a href="/restaurantes" class="px-2.5 py-1.5 rounded-lg hover:text-amber-700 hover:bg-amber-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-utensils text-amber-600 text-[11px]"></i>
        <span>Restaurantes</span>
      </a>
      <a href="/salones-belleza" class="px-2.5 py-1.5 rounded-lg hover:text-pink-700 hover:bg-pink-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-scissors text-pink-500 text-[11px]"></i>
        <span>Salones</span>
      </a>
      <a href="/comercios" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-700 hover:bg-emerald-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-store text-emerald-600 text-[11px]"></i>
        <span>Comercios</span>
      </a>
      <a href="/nosotros" class="px-2.5 py-1.5 rounded-lg hover:text-indigo-700 hover:bg-indigo-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-shield-halved text-indigo-600 text-[11px]"></i>
        <span>Sobre Nosotros</span>
      </a>
    </nav>

    <!-- Action Buttons & Reorganized User Panel -->
    <div class="flex items-center gap-1.5 sm:gap-2.5 flex-nowrap shrink-0">
      
      <!-- Botón Mi Plan -->
      <button id="btn-open-plans" type="button" title="Ver Planes y Precios"
        class="flex items-center gap-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 font-semibold px-2 sm:px-3 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs shadow-xs transition transform active:scale-95 whitespace-nowrap shrink-0">
        <i class="fa-solid fa-gem text-amber-600 text-xs"></i>
        <span class="hidden sm:inline">Mi Plan</span>
      </button>

      <!-- Botón Mis Códigos QR / Historial -->
      <button id="btn-open-history" type="button" title="Historial de Códigos QR"
        class="flex items-center gap-1.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold px-2 sm:px-3 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs shadow-xs transition transform active:scale-95 whitespace-nowrap shrink-0">
        <i class="fa-solid fa-list-check text-indigo-600 text-xs"></i>
        <span class="hidden md:inline">Mis Códigos QR</span>
        <span class="inline md:hidden text-[11px] sm:text-xs">QRs</span>
      </button>

      <!-- Botón Ayuda / FAQ -->
      <button id="btn-open-faq" type="button" title="Centro de Ayuda y Preguntas Frecuentes"
        class="flex items-center gap-1.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold px-2 sm:px-3 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs shadow-xs transition transform active:scale-95 whitespace-nowrap shrink-0">
        <i class="fa-solid fa-circle-question text-cyan-600 text-xs"></i>
        <span class="hidden sm:inline">Ayuda</span>
      </button>

      <!-- Panel Dinámico de Usuario: Registro/Ingreso (Desconectado) vs Icono, Nombre y (ver perfil) (Conectado) -->
      <!-- 1. Estado Registrado / Autenticado -->
      <button id="user-profile-widget" type="button" title="Ver Mi Perfil y Detalles de Cuenta"
        class="hidden flex items-center gap-1.5 sm:gap-2 bg-slate-50 hover:bg-indigo-50/80 border border-slate-200 hover:border-indigo-300 rounded-full py-1 px-2.5 sm:px-3 text-xs transition cursor-pointer group shadow-2xs shrink-0">
        <img id="user-avatar" src="" alt="Avatar" class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-slate-300 object-cover border border-slate-200 group-hover:scale-105 transition shrink-0">
        <span id="user-name" class="font-semibold text-slate-800 group-hover:text-indigo-700 transition truncate max-w-[70px] xs:max-w-[90px] sm:max-w-[130px]"></span>
        <span class="text-[11px] text-indigo-600 font-medium group-hover:underline shrink-0 hidden xs:inline">(ver perfil)</span>
      </button>

      <!-- 2. Estado No Registrado / Desconectado -->
      <button id="btn-open-oauth" type="button" title="Iniciar Sesión o Registrarse"
        class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold px-2.5 sm:px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs shadow-xs transition whitespace-nowrap shrink-0">
        <i class="fa-solid fa-user-plus text-xs"></i>
        <span class="hidden sm:inline">Registro / Ingreso</span>
        <span class="inline sm:hidden text-[11px]">Ingreso</span>
      </button>
    </div>
  </div>

  <!-- Sub-barra de Accesos Directos para Móviles y Tablets (< lg) -->
  <div class="lg:hidden bg-slate-50/95 border-t border-slate-200/80 px-2 py-1.5 flex items-center justify-around text-[11px] font-semibold text-slate-600">
    <a href="/restaurantes" class="px-2 py-1 rounded-md hover:text-amber-700 hover:bg-amber-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-utensils text-amber-600 text-[10px]"></i>
      <span>Restaurantes</span>
    </a>
    <a href="/salones-belleza" class="px-2 py-1 rounded-md hover:text-pink-700 hover:bg-pink-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-scissors text-pink-500 text-[10px]"></i>
      <span>Salones</span>
    </a>
    <a href="/comercios" class="px-2 py-1 rounded-md hover:text-emerald-700 hover:bg-emerald-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-store text-emerald-600 text-[10px]"></i>
      <span>Comercios</span>
    </a>
    <a href="/nosotros" class="px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-shield-halved text-indigo-600 text-[10px]"></i>
      <span>Nosotros</span>
    </a>
  </div>
</header>
