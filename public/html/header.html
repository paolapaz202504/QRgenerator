<!-- Header Navbar Component (Light SaaS Theme) -->
<header class="border-b border-slate-200 bg-white/95 backdrop-blur-md sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4 flex-nowrap">
    <div class="flex items-center gap-3 shrink-0 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 shrink-0">
        <i class="fa-solid fa-qrcode text-xl"></i>
      </div>
      <div class="min-w-0 flex items-center gap-2">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold font-['Outfit'] tracking-tight text-slate-900">
              QRbey
            </h1>
            <!-- Changelog Modal Trigger Badge (Estándar DevTeam) -->
            <button id="btn-open-changelog" type="button" title="Ver Historial de Cambios / Novedades"
              class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200/80 text-[11px] font-mono font-bold px-2 py-0.5 rounded-full flex items-center gap-1 transition active:scale-95 shadow-2xs">
              <i class="fa-solid fa-code-branch text-[9px]"></i>
              <span>v1.5.0</span>
            </button>
          </div>
          <p class="text-xs text-slate-500 font-medium hidden md:block truncate">Diseña Códigos QR profesionales con logo, colores y estilo empresarial</p>
        </div>
      </div>
    </div>

    <!-- OAuth 2.0 User Profile Widget & Action Buttons -->
    <div class="flex items-center gap-2 sm:gap-3 flex-nowrap shrink-0">
      <div id="user-profile-widget" class="hidden flex items-center gap-2.5 bg-slate-100 border border-slate-200 rounded-full px-3 py-1 text-xs whitespace-nowrap shrink-0">
        <img id="user-avatar" src="" alt="Avatar" class="w-6 h-6 rounded-full bg-slate-300 cursor-pointer hover:opacity-80 transition" title="Ver Mi Perfil">
        <span id="user-name" class="font-semibold text-slate-800 truncate max-w-[120px] cursor-pointer hover:text-indigo-600 transition" title="Ver Mi Perfil"></span>
        <span id="user-plan-badge" class="bg-indigo-100 text-indigo-800 border border-indigo-200 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider" title="Plan Actual">Plan Pro</span>
        <span id="user-credit-counter" class="bg-cyan-50 text-cyan-700 border border-cyan-200 px-2 py-0.5 rounded-full text-[10px] font-mono font-bold" title="Créditos de Generación Usados">0/50 Créditos</span>
        <span id="user-download-counter" class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded-full text-[10px] font-mono font-bold" title="Descargas Usadas">0/15 QRs</span>
        <button id="btn-open-profile" type="button" title="Ver Mi Perfil" class="text-slate-500 hover:text-indigo-600 ml-0.5 transition">
          <i class="fa-solid fa-id-card text-sm"></i>
        </button>
        <button id="btn-logout" title="Cerrar Sesión" class="text-slate-500 hover:text-rose-600 ml-0.5 transition">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

      <button id="btn-open-plans" type="button"
        class="flex items-center gap-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 font-semibold px-3 sm:px-3.5 py-2 rounded-xl text-xs shadow-xs transition transform active:scale-95 whitespace-nowrap shrink-0">
        <i class="fa-solid fa-gem text-amber-600"></i>
        Mi Plan
      </button>

      <button id="btn-open-history" type="button"
        class="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold px-3 sm:px-3.5 py-2 rounded-xl text-xs shadow-xs transition transform active:scale-95 whitespace-nowrap shrink-0">
        <i class="fa-solid fa-list-check text-indigo-600"></i>
        Mis Códigos QR
      </button>

      <button id="btn-open-faq" type="button"
        class="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold px-3 sm:px-3.5 py-2 rounded-xl text-xs shadow-xs transition transform active:scale-95 whitespace-nowrap shrink-0">
        <i class="fa-solid fa-circle-question text-cyan-600"></i>
        Ayuda
      </button>

      <button id="btn-open-oauth" type="button"
        class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3.5 sm:px-4 py-2 rounded-xl text-xs shadow-sm transition transform active:scale-95 whitespace-nowrap shrink-0">
        <i class="fa-solid fa-user-plus"></i>
        Registro / Ingreso
      </button>
    </div>
  </div>
</header>
