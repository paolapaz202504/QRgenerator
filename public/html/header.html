<!-- Header Navbar Component (Light SaaS Theme - Multi-Device Responsive) -->
<header class="border-b border-slate-200 bg-white/95 backdrop-blur-md sticky top-0 z-50 shadow-xs">
  <div class="max-w-7xl mx-auto px-2.5 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-1.5 sm:gap-4 flex-nowrap">
    <!-- Brand / Logo Area -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0 min-w-0">
      <a href="/" class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl overflow-hidden shadow-md shadow-indigo-500/20 shrink-0 border border-indigo-400/30 flex items-center justify-center bg-indigo-950 group">
        <img src="/favicon.svg" alt="QRbey Logo" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
      </a>
      <div class="min-w-0 flex items-center gap-1.5 sm:gap-2">
        <div>
          <div class="flex items-center gap-1.5 sm:gap-2">
            <a href="/" class="text-lg sm:text-xl font-bold font-['Outfit'] tracking-tight text-slate-900 hover:text-indigo-600 transition">
              QRbey
            </a>
            <!-- Changelog Modal Trigger Badge (Estándar DevTeam) -->
            <button id="btn-open-changelog" type="button" title="Ver Historial de Cambios / Novedades"
              class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200/80 text-[10px] sm:text-[11px] font-mono font-bold px-1.5 sm:px-2 py-0.5 rounded-full flex items-center gap-1 transition active:scale-95 shadow-2xs">
              <i class="fa-solid fa-code-branch text-[8px] sm:text-[9px]"></i>
              <span>v1.11.2</span>
            </button>
          </div>
          <p class="text-xs text-slate-500 font-medium hidden xl:block truncate max-w-xs">Códigos QR dinámicos para negocios de barrio</p>
        </div>
      </div>
    </div>

    <!-- Navegación Directa Ordenada: Inicio, Soluciones y Sectores, Editor, Precios, Nosotros, Ayuda, Contacto -->
    <nav class="hidden lg:flex items-center gap-1 xl:gap-2 text-xs font-semibold text-slate-600">
      <!-- 1. Inicio -->
      <a href="/" class="nav-item-inicio px-2.5 py-1.5 rounded-lg hover:text-indigo-700 hover:bg-indigo-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-house text-indigo-600 text-[11px]"></i>
        <span>Inicio</span>
      </a>

      <!-- 2. Soluciones y Sectores (Dropdown) -->
      <div class="relative group/nav-dropdown">
        <button type="button" class="nav-item-soluciones px-2.5 py-1.5 rounded-lg hover:text-indigo-700 hover:bg-indigo-50 transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-layer-group text-indigo-600 text-[11px]"></i>
          <span>Soluciones y Sectores</span>
          <i class="fa-solid fa-chevron-down text-[9px] text-slate-400 group-hover/nav-dropdown:rotate-180 transition-transform duration-200"></i>
        </button>
        <!-- Submenús con iconos contextuales -->
        <div class="absolute left-0 top-full pt-1.5 hidden group-hover/nav-dropdown:block z-50 w-56">
          <div class="bg-white rounded-xl shadow-xl border border-slate-200 p-1.5 backdrop-blur-md space-y-0.5">
            <a href="/restaurantes" class="nav-sub-restaurantes flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-slate-700 hover:bg-amber-50 hover:text-amber-800 transition">
              <span class="w-6 h-6 rounded-md bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-utensils text-xs"></i>
              </span>
              <div>
                <span class="font-bold block text-slate-900">Restaurantes</span>
                <span class="text-[10px] text-slate-500 font-normal">Menús QR digitales</span>
              </div>
            </a>
            <a href="/salones-belleza" class="nav-sub-salones flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-slate-700 hover:bg-pink-50 hover:text-pink-800 transition">
              <span class="w-6 h-6 rounded-md bg-pink-100 text-pink-600 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-scissors text-xs"></i>
              </span>
              <div>
                <span class="font-bold block text-slate-900">Salones</span>
                <span class="text-[10px] text-slate-500 font-normal">Citas por WhatsApp</span>
              </div>
            </a>
            <a href="/comercios" class="nav-sub-comercios flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 transition">
              <span class="w-6 h-6 rounded-md bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-store text-xs"></i>
              </span>
              <div>
                <span class="font-bold block text-slate-900">Comercios</span>
                <span class="text-[10px] text-slate-500 font-normal">WiFi y promociones</span>
              </div>
            </a>
          </div>
        </div>
      </div>

      <!-- 3. Editor -->
      <a href="/editor" class="nav-item-editor px-2.5 py-1.5 rounded-lg hover:text-indigo-700 hover:bg-indigo-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-sliders text-indigo-600 text-[11px]"></i>
        <span>Editor</span>
      </a>

      <!-- 4. Precios -->
      <a href="/#planes" id="btn-open-plans" class="nav-item-precios px-2.5 py-1.5 rounded-lg hover:text-amber-800 hover:bg-amber-50 text-slate-600 transition flex items-center gap-1.5 cursor-pointer" title="Ver Precios y Planes">
        <i class="fa-solid fa-tags text-amber-600 text-[11px]"></i>
        <span>Precios</span>
      </a>

      <!-- 5. Nosotros -->
      <a href="/sobre-nosotros" class="nav-item-nosotros px-2.5 py-1.5 rounded-lg hover:text-indigo-700 hover:bg-indigo-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-shield-halved text-indigo-600 text-[11px]"></i>
        <span>Nosotros</span>
      </a>

      <!-- 6. Ayuda -->
      <a href="/#faq" id="btn-open-faq" class="nav-item-ayuda px-2.5 py-1.5 rounded-lg hover:text-cyan-700 hover:bg-cyan-50 text-slate-600 transition flex items-center gap-1.5 cursor-pointer" title="Centro de Ayuda y Preguntas Frecuentes">
        <i class="fa-solid fa-circle-question text-cyan-600 text-[11px]"></i>
        <span>Ayuda</span>
      </a>

      <!-- 7. Contacto -->
      <a href="/contacto" class="nav-item-contacto px-2.5 py-1.5 rounded-lg hover:text-indigo-700 hover:bg-indigo-50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-envelope text-indigo-600 text-[11px]"></i>
        <span>Contacto</span>
      </a>
    </nav>

    <!-- 8. ("Registrar / Iniciar" o "Perfil de usuario registrado") -->
    <div class="flex items-center gap-1.5 sm:gap-2.5 flex-nowrap shrink-0">
      <!-- 8a. Perfil de Usuario Registrado -->
      <button id="user-profile-widget" type="button" title="Ver Mi Perfil de Usuario Registrado"
        class="hidden flex items-center gap-1.5 sm:gap-2 bg-slate-50 hover:bg-indigo-50/80 border border-slate-200 hover:border-indigo-300 rounded-full py-1 px-2.5 sm:px-3 text-xs transition cursor-pointer group shadow-2xs shrink-0">
        <img id="user-avatar" src="" alt="Avatar" class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-slate-300 object-cover border border-slate-200 group-hover:scale-105 transition shrink-0">
        <span id="user-name" class="font-semibold text-slate-800 group-hover:text-indigo-700 transition truncate max-w-[70px] xs:max-w-[90px] sm:max-w-[130px]"></span>
        <span class="text-[11px] text-indigo-600 font-medium group-hover:underline shrink-0 hidden xs:inline">(ver perfil)</span>
      </button>

      <!-- 8b. Botón Registrar / Iniciar -->
      <button id="btn-open-oauth" type="button" title="Registrar / Iniciar Sesión"
        class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold px-2.5 sm:px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs shadow-xs transition whitespace-nowrap shrink-0 cursor-pointer">
        <i class="fa-solid fa-user-plus text-xs"></i>
        <span class="hidden sm:inline">Registrar / Iniciar</span>
        <span class="inline sm:hidden text-[11px]">Ingreso</span>
      </button>
    </div>
  </div>

  <!-- Sub-barra de Accesos Directos para Móviles y Tablets (< lg) -->
  <div class="lg:hidden bg-slate-50/95 border-t border-slate-200/80 px-2 py-1.5 flex items-center justify-around text-[11px] font-semibold text-slate-600 overflow-x-auto gap-1">
    <!-- 1. Inicio -->
    <a href="/" class="nav-m-inicio px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-house text-indigo-600 text-[10px]"></i>
      <span>Inicio</span>
    </a>

    <!-- 2. Soluciones -->
    <div class="relative group/mobile-dropdown shrink-0">
      <button type="button" class="nav-m-soluciones px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 cursor-pointer">
        <i class="fa-solid fa-layer-group text-indigo-600 text-[10px]"></i>
        <span>Soluciones</span>
        <i class="fa-solid fa-chevron-down text-[8px] text-slate-400"></i>
      </button>
      <div class="absolute left-0 top-full pt-1 hidden group-hover/mobile-dropdown:block z-50 w-44">
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-1 space-y-0.5">
          <a href="/restaurantes" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-[11px] font-semibold text-slate-700 hover:bg-amber-50 hover:text-amber-700">
            <i class="fa-solid fa-utensils text-amber-600 text-[10px] w-3.5"></i>
            <span>Restaurantes</span>
          </a>
          <a href="/salones-belleza" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-[11px] font-semibold text-slate-700 hover:bg-pink-50 hover:text-pink-700">
            <i class="fa-solid fa-scissors text-pink-500 text-[10px] w-3.5"></i>
            <span>Salones</span>
          </a>
          <a href="/comercios" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-[11px] font-semibold text-slate-700 hover:bg-emerald-50 hover:text-emerald-700">
            <i class="fa-solid fa-store text-emerald-600 text-[10px] w-3.5"></i>
            <span>Comercios</span>
          </a>
        </div>
      </div>
    </div>

    <!-- 3. Editor -->
    <a href="/editor" class="nav-m-editor px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-sliders text-indigo-600 text-[10px]"></i>
      <span>Editor</span>
    </a>

    <!-- 4. Precios -->
    <a href="/#planes" class="nav-m-precios px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-tags text-amber-600 text-[10px]"></i>
      <span>Precios</span>
    </a>

    <!-- 5. Nosotros -->
    <a href="/sobre-nosotros" class="nav-m-nosotros px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-shield-halved text-indigo-600 text-[10px]"></i>
      <span>Nosotros</span>
    </a>

    <!-- 6. Ayuda -->
    <a href="/#faq" class="nav-m-ayuda px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-circle-question text-cyan-600 text-[10px]"></i>
      <span>Ayuda</span>
    </a>

    <!-- 7. Contacto -->
    <a href="/contacto" class="nav-m-contacto px-2 py-1 rounded-md hover:text-indigo-700 hover:bg-indigo-50/80 flex items-center gap-1 shrink-0">
      <i class="fa-solid fa-envelope text-indigo-600 text-[10px]"></i>
      <span>Contacto</span>
    </a>
  </div>
  <script>
    (function() {
      const p = window.location.pathname.replace(/\/$/, '') || '/';
      // Resaltar enlace activo directo
      document.querySelectorAll('header nav a, header div.lg\\:hidden a').forEach(a => {
        const h = (a.getAttribute('href') || '').replace(/\/$/, '') || '/';
        if (h === p) {
          a.classList.add('bg-indigo-50', 'text-indigo-700', 'font-bold');
        }
      });
      // Resaltar disparador de Soluciones y Sectores si la ruta actual es una de las verticales
      if (['/restaurantes', '/salones-belleza', '/comercios'].includes(p)) {
        document.querySelectorAll('.nav-item-soluciones, .nav-m-soluciones').forEach(el => {
          el.classList.add('bg-indigo-50', 'text-indigo-700', 'font-bold');
        });
      }
      // Soporte táctil en móvil para desplegar submenú al pulsar
      const mobBtn = document.querySelector('.nav-m-soluciones');
      if (mobBtn) {
        mobBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const drop = mobBtn.nextElementSibling;
          if (drop) drop.classList.toggle('hidden');
        });
        document.addEventListener('click', () => {
          const drop = mobBtn.nextElementSibling;
          if (drop) drop.classList.add('hidden');
        });
      }
    })();
  </script>
</header>
