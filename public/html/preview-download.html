<!-- Live Interactive Preview & Download Card (Light SaaS Theme) -->
<div class="bg-white border border-slate-200/90 rounded-2xl p-6 shadow-md space-y-5 text-center">
  <div class="flex items-center justify-between border-b border-slate-100 pb-3 text-left">
    <div>
      <h3 class="text-sm font-bold text-slate-900">Vista Previa en Vivo</h3>
      <p class="text-xs text-slate-500">Renderizado con ícono o logotipo HD</p>
    </div>
    <span id="live-indicator" class="flex items-center gap-1.5 text-xs text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-200">
      <span class="w-1.5 h-1.5 rounded-full bg-indigo-600 animate-ping"></span>
      En tiempo real
    </span>
  </div>

  <!-- QR Canvas Container -->
  <div class="relative flex items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 min-h-[380px] shadow-inner">
    <canvas id="qr-canvas" class="max-w-full h-auto drop-shadow-md rounded-xl transition-all duration-300"></canvas>
    
    <!-- Loading Overlay -->
    <div id="canvas-loader" class="hidden absolute inset-0 bg-white/80 rounded-xl backdrop-blur-xs flex flex-col items-center justify-center gap-3">
      <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-xs font-semibold text-slate-700">Generando diseño...</span>
    </div>
  </div>

  <!-- Download Options Card -->
  <div class="space-y-3 pt-2">
    <h4 class="text-xs font-semibold text-slate-600 uppercase tracking-wider text-left">Opciones de Descarga</h4>
    
    <div class="grid grid-cols-2 gap-3">
      <button id="btn-download-png" type="button"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-xs flex items-center justify-center gap-2 transition text-xs">
        <i class="fa-solid fa-download"></i>
        Descargar PNG (800px)
      </button>

      <button id="btn-download-hd" type="button"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-xl shadow-xs flex items-center justify-center gap-2 transition text-xs">
        <i class="fa-solid fa-file-image"></i>
        Descargar HD (2000px)
      </button>
    </div>

    <button id="btn-download-svg" type="button"
      class="w-full bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 font-semibold py-2.5 px-4 rounded-xl shadow-xs flex items-center justify-center gap-2 transition text-xs">
      <i class="fa-solid fa-code text-indigo-600"></i>
      Descargar Vector SVG (Imprenta)
    </button>
  </div>

  <div class="pt-2 border-t border-slate-100 flex items-center justify-around text-slate-600 text-xs font-medium">
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-emerald-600"></i> Código Válido</span>
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-amber-500"></i> Alta Calidad</span>
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-infinity text-cyan-600"></i> Sin Límites</span>
  </div>
</div>
