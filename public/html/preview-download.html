<!-- Live Interactive Preview & Download Card -->
<div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5 text-center">
  <div class="flex items-center justify-between border-b border-slate-800 pb-3 text-left">
    <div>
      <h3 class="text-sm font-bold text-slate-200">Vista Previa en Vivo</h3>
      <p class="text-xs text-slate-400">Renderizado con ícono o logotipo</p>
    </div>
    <span id="live-indicator" class="flex items-center gap-1.5 text-xs text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-full border border-indigo-500/20">
      <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping"></span>
      En tiempo real
    </span>
  </div>

  <!-- QR Canvas Container -->
  <div class="relative flex items-center justify-center p-4 bg-slate-950/60 rounded-xl border border-slate-800/80 min-h-[380px]">
    <canvas id="qr-canvas" class="max-w-full h-auto drop-shadow-2xl rounded-xl transition-all duration-300"></canvas>
    
    <!-- Loading Overlay -->
    <div id="canvas-loader" class="hidden absolute inset-0 bg-slate-950/80 rounded-xl backdrop-blur-sm flex flex-col items-center justify-center gap-3">
      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-xs font-medium text-slate-300">Generando diseño...</span>
    </div>
  </div>

  <!-- Download Options Card -->
  <div class="space-y-3 pt-2">
    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-left">Opciones de Descarga</h4>
    
    <div class="grid grid-cols-2 gap-3">
      <button id="btn-download-png" type="button"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition text-xs">
        <i class="fa-solid fa-download"></i>
        Descargar PNG
      </button>

      <button id="btn-download-hd" type="button"
        class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition text-xs">
        <i class="fa-solid fa-file-image"></i>
        Descargar HD (2000px)
      </button>
    </div>

    <button id="btn-download-svg" type="button"
      class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2.5 px-4 rounded-xl shadow-sm flex items-center justify-center gap-2 transition text-xs">
      <i class="fa-solid fa-code"></i>
      Descargar Vector SVG
    </button>
  </div>

  <div class="pt-2 border-t border-slate-800 flex items-center justify-around text-slate-400 text-xs">
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-emerald-400"></i> Código Válido</span>
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-amber-400"></i> Alta Calidad</span>
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-infinity text-cyan-400"></i> Sin Límites</span>
  </div>
</div>
