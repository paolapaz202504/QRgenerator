<!-- Sección Incorporada: Historial y Tabla de Códigos QR Generados (Light SaaS Theme) -->
<section id="section-history" class="mt-12 bg-white border border-slate-200/90 rounded-3xl p-6 sm:p-8 shadow-sm space-y-6">
  
  <!-- Encabezado de la Sección -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white flex items-center justify-center text-lg shadow-sm">
        <i class="fa-solid fa-list-check"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold font-['Outfit'] text-slate-900">Historial de Códigos QR Generados</h2>
        <p class="text-xs text-slate-500">Tabla interactiva con búsqueda en tiempo real, paginación y zona horaria</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <span id="history-total-count" class="text-xs font-semibold px-3.5 py-1.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 font-mono">
        0 Registros
      </span>
      <button id="btn-refresh-history" type="button" title="Actualizar Tabla" class="w-9 h-9 rounded-xl bg-white hover:bg-slate-50 text-slate-600 hover:text-slate-900 flex items-center justify-center border border-slate-200 shadow-xs transition">
        <i class="fa-solid fa-arrows-rotate text-xs"></i>
      </button>
    </div>
  </div>

  <!-- Barra de Filtros: Búsqueda y Paginador de Filas -->
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
    <!-- Buscador -->
    <div class="relative w-full sm:w-80">
      <input type="text" id="history-search-input" placeholder="Buscar por título, enlace o fecha..." 
        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 pl-10 text-xs text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
      <div class="absolute left-3.5 top-3 text-slate-400 text-xs">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </div>

    <!-- Selector de Tamaño de Página -->
    <div class="flex items-center gap-2 text-xs text-slate-600 font-medium self-end sm:self-auto">
      <span>Mostrar:</span>
      <select id="history-page-size" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none cursor-pointer">
        <option value="5">5 por página</option>
        <option value="10" selected>10 por página</option>
        <option value="25">25 por página</option>
        <option value="50">50 por página</option>
      </select>
    </div>
  </div>

  <!-- Tabla Responsive de Registros -->
  <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-xs">
    <table class="w-full text-left text-xs border-collapse">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase text-[11px] tracking-wider">
          <th class="py-3.5 px-4 w-28">Miniatura</th>
          <th class="py-3.5 px-4 min-w-[180px]">Título / Nombre del QR</th>
          <th class="py-3.5 px-4 min-w-[220px]">Enlace de Destino</th>
          <th class="py-3.5 px-4 min-w-[200px]">Fecha y Hora</th>
          <th class="py-3.5 px-4 text-center w-32">Acción</th>
        </tr>
      </thead>
      <tbody id="history-table-body" class="divide-y divide-slate-100 text-slate-700">
        <!-- Dynamically rendered rows -->
      </tbody>
    </table>
  </div>

  <!-- Paginador Inferior -->
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
    <span id="history-pagination-info" class="text-xs text-slate-500 font-medium">
      Mostrando 0 - 0 de 0 resultados
    </span>

    <div class="flex items-center gap-2">
      <button id="btn-page-prev" type="button" 
        class="px-3.5 py-2 bg-white hover:bg-slate-50 text-slate-600 font-semibold rounded-xl border border-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition text-xs flex items-center gap-1.5 shadow-2xs">
        <i class="fa-solid fa-chevron-left text-[10px]"></i>
        Anterior
      </button>

      <div id="history-page-numbers" class="flex items-center gap-1">
        <!-- Números de Página Dinámicos -->
      </div>

      <button id="btn-page-next" type="button" 
        class="px-3.5 py-2 bg-white hover:bg-slate-50 text-slate-600 font-semibold rounded-xl border border-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition text-xs flex items-center gap-1.5 shadow-2xs">
        Siguiente
        <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>
</section>
