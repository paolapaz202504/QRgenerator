<!-- Fine-Tuning Colors Customizer (Collapsible) -->
<div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
  <button id="toggle-customizer" type="button" class="w-full flex items-center justify-between text-xs font-semibold text-slate-300 hover:text-white transition">
    <div class="flex items-center gap-3">
      <span class="w-7 h-7 rounded-lg bg-amber-600/20 border border-amber-500/30 text-amber-400 font-bold text-sm flex items-center justify-center">5</span>
      <h2 class="text-base font-semibold text-slate-100">Personalizar Colores de Fondo y Marco</h2>
    </div>
    <i id="customizer-icon" class="fa-solid fa-chevron-down transition-transform duration-200"></i>
  </button>
  
  <div id="customizer-panel" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-4 pt-3 border-t border-slate-800">
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Color de Puntos (QR)</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-qr-color" value="#111827" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-qr-color-hex" class="text-xs font-mono text-slate-300">#111827</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Color de Fondo</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-bg-color" value="#ffffff" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-bg-color-hex" class="text-xs font-mono text-slate-300">#ffffff</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Color de Marco</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-frame-color" value="#2563eb" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-frame-color-hex" class="text-xs font-mono text-slate-300">#2563eb</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Estilo de Esquinas (Finders)</label>
      <select id="custom-eye-style" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200">
        <option value="square">Cuadradas</option>
        <option value="rounded">Redondeadas</option>
        <option value="circle">Círculos</option>
      </select>
    </div>
  </div>
</div>
