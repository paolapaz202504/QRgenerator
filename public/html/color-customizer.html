<!-- Fine-Tuning Colors Customizer (Collapsible) -->
<div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
  <button id="toggle-customizer" type="button" class="w-full flex items-center justify-between text-xs font-semibold text-slate-300 hover:text-white transition">
    <div class="flex items-center gap-3">
      <span class="w-7 h-7 rounded-lg bg-amber-600/20 border border-amber-500/30 text-amber-400 font-bold text-sm flex items-center justify-center">5</span>
      <h2 class="text-base font-semibold text-slate-100">Personalizar Colores de Fondo y Marco</h2>
    </div>
    <i id="customizer-icon" class="fa-solid fa-chevron-down transition-transform duration-200 rotate-180"></i>
  </button>
  
  <div id="customizer-panel" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pt-3 border-t border-slate-800">
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Color de Puntos (QR)</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-qr-color" value="#111827" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-qr-color-hex" class="text-xs font-mono text-slate-300">#111827</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Tipo de Color QR</label>
      <select id="custom-gradient-type" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200">
        <option value="single">Sólido</option>
        <option value="linear">Degradado Lineal</option>
        <option value="radial">Degradado Radial</option>
      </select>
    </div>
    <div id="container-qr-color2" class="hidden">
      <label class="block text-xs font-medium text-slate-400 mb-1">Color 2 (Degradado)</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-qr-color2" value="#a855f7" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-qr-color2-hex" class="text-xs font-mono text-slate-300">#a855f7</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Color de Ojos (Finders)</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-eye-color" value="#111827" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-eye-color-hex" class="text-xs font-mono text-slate-300">#111827</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Estilo de Ojos (Finders)</label>
      <select id="custom-eye-style" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200">
        <option value="square">Cuadradas</option>
        <option value="rounded">Redondeadas</option>
        <option value="circle">Círculos Concéntricos</option>
        <option value="diamond">Rombos / Diamantes</option>
        <option value="hexagon">Hexágonos</option>
        <option value="leaf">Hoja / Gota</option>
        <option value="star">Estrella 8 Puntas</option>
        <option value="shield">Escudo Protegido</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Color de Fondo</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-bg-color" value="#ffffff" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-bg-color-hex" class="text-xs font-mono text-slate-300">#ffffff</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Color de Marco</label>
      <div class="flex items-center gap-2">
        <input type="color" id="custom-frame-color" value="#2563eb" class="w-9 h-9 rounded bg-transparent cursor-pointer border border-slate-700">
        <span id="custom-frame-color-hex" class="text-xs font-mono text-slate-300">#2563eb</span>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Forma del Marco General</label>
      <select id="custom-frame-shape" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200">
        <option value="rectangular">1. Rectangular Clásico</option>
        <option value="square">2. Cuadrado Moderno</option>
        <option value="rounded">3. Cápsula / Redondeado</option>
        <option value="circle">4. Circular / Redondo</option>
        <option value="shield">5. Escudo Insignia</option>
        <option value="ticket">6. Ticket / Cupón</option>
        <option value="hexagonal">7. Hexágono Neón Futuro</option>
        <option value="diamond_card">8. Biseles Diagonales Elegante</option>
        <option value="badge_star">9. Insignia Octágono Estrella</option>
        <option value="wavy">10. Esquinas Invertidas Flotantes</option>
      </select>
    </div>
  </div>
</div>
