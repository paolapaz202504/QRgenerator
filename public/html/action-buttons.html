<!-- Action Buttons Card Component -->
<div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
  <div class="flex-1 w-full flex flex-col gap-2">
    <button id="btn-generate" type="button"
      class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all transform active:scale-[0.99] text-sm">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      Generar Código QR
    </button>
    <div class="flex items-center justify-between text-xs text-slate-400 px-1">
      <span><i class="fa-solid fa-coins text-amber-400 mr-1"></i>Créditos de Generación:</span>
      <span id="credit-counter-badge" class="font-mono font-bold text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">0/200 Créditos</span>
    </div>
  </div>
  
  <button id="btn-reset" type="button"
    class="px-5 sm:self-start py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-semibold rounded-xl border border-slate-700 transition text-sm flex items-center justify-center gap-2">
    <i class="fa-solid fa-rotate-left"></i>
    Restablecer
  </button>
</div>
