services:
  - type: web
    name: qrbey
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3030
      - key: APP_URL
        value: https://qrbey.onrender.com
      - key: PLAN_FREE_MAX_DOWNLOADS
        value: "15"
      - key: PLAN_FREE_MAX_CREDITS
        value: "50"
      - key: PLAN_PRO_PRICE_MONTHLY
        value: "9.99"
      - key: PLAN_PRO_MAX_DOWNLOADS
        value: "500"
      - key: PLAN_PRO_MAX_CREDITS
        value: "2000"
      - key: PLAN_CORP_PRICE_MONTHLY
        value: "29.99"
      - key: PLAN_CORP_MAX_DOWNLOADS
        value: "2000"
      - key: PLAN_CORP_MAX_CREDITS
        value: "10000"
      - key: RECURRENTE_ENVIRONMENT
        value: sandbox
